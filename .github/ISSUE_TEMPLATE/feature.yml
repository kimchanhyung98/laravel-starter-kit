name: Feature Request
description: Suggest an idea or enhancement for the project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Please share the details below.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Why is this needed?
      placeholder: It's hard to do X because...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: I'd like to add...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other approaches or workarounds?
      placeholder: I've tried...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Provide any other context or screenshots about the request.
    validations:
      required: false
